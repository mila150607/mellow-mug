<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order - Mellow Mug</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">MELLOW MUG</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="order.html" class="order-btn">Order now</a>
    </nav>
  </header>

  <section class="hero">
  <div class="hero-text">
    <h1>Checkout</h1>
    <ul id="orderList"></ul>
    <p><strong>Total: RM <span id="totalPrice">0</span></strong></p>

    <h2>Delivery Details</h2>
    <form id="deliveryForm">
      <label>Name:</label><br>
      <input type="text" id="custName" required><br><br>

      <label>Address:</label><br>
      <textarea id="custAddress" rows="3" required></textarea><br><br>

      <label>Phone:</label><br>
      <input type="text" id="custPhone" required><br><br>

      <button type="submit" class="menu-btn">Place Order</button>
    </form>
    <p id="successMsg" style="color:green; display:none;">✅ Order placed successfully! Thank you.</p>
  </div>
</section>

<script>
  const orderList = document.getElementById("orderList");
  const totalPriceEl = document.getElementById("totalPrice");
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;

  cart.forEach(order => {
    const li = document.createElement("li");
    li.textContent = order.item + " - RM " + order.price;
    orderList.appendChild(li);
    total += order.price;
  });
  totalPriceEl.textContent = total;

  const form = document.getElementById("deliveryForm");
  const successMsg = document.getElementById("successMsg");

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("custName").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    const phone = document.getElementById("custPhone").value.trim();

    if(name && address && phone && cart.length > 0) {
      successMsg.style.display = "block";
      localStorage.removeItem("cart");
      orderList.innerHTML = "";
      totalPriceEl.textContent = "0";
      form.reset();
    } else {
      alert("Please fill in all fields and add items to cart.");
    }
  });
</script>

  <footer>
    <p>© 2026 Mellow Mug | Follow us on 
      <a href="#">Instagram</a> • <a href="#">Facebook</a> • <a href="#">Twitter</a>
    </p>
  </footer>
</body>
</html>
